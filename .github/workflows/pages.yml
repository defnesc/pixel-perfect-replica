# Publishes the site to GitHub Pages (333jewelry.com) as plain HTML files.
# Runs on every push to main (including edits synced from Lovable), once a day so the
# prices baked into the pages stay close to the Price Sheet, and by hand from the Actions tab.
# Visitors' browsers still load live prices from the Price Sheet, so a sheet change shows
# within minutes even before the next rebuild.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # every day 06:17 Istanbul time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: |
          # Lovable's lockfile points one package at Lovable's private npm cache; use the public copy.
          sed -i 's#https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/#https://registry.npmjs.org/#g' bun.lock
          bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build static pages
        env:
          STATIC_SITE: "1"
        run: bun run build

      - name: Prepare for GitHub Pages
        run: |
          cd dist/client
          cp _shell.html index.html   # 333jewelry.com/ → picks EN or TR by the visitor's language
          cp _shell.html 404.html     # any page not built ahead still opens in the browser
          echo "333jewelry.com" > CNAME
          touch .nojekyll
          test -f en/index.html && test -f tr/index.html && test -f tr/product/star/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
